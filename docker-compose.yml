# Local Postgres, so the whole suite runs the way CI does — including the two
# tests that prove the marquee guarantees and SKIP on SQLite (the deferred
# over-refund CONSTRAINT TRIGGER and the concurrent row-lock race).
#
#   docker compose up -d
#   DATABASE_URL=postgres://refunds:refunds@localhost:5433/refunds_test bin/rails db:prepare
#   DATABASE_URL=postgres://refunds:refunds@localhost:5433/refunds_test bin/rails db:ensure_constraints
#   DATABASE_URL=postgres://refunds:refunds@localhost:5433/refunds_test bin/rails test
#
# Without DATABASE_URL the suite still runs on SQLite (fast, 2 skips).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: refunds
      POSTGRES_DB: refunds_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunds"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - refunds_pg:/var/lib/postgresql/data

volumes:
  refunds_pg:
