<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">refunds &amp; payouts: a Rails refund state machine and double-entry ledger</title>
  <desc id="desc">A refund moves requested, processing, settled, or fails. Settling posts one balancing ledger entry, taken from the live demo: revenue:charges minus 25.00, stripe:cash plus 25.00, summing to 0.00.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#616c7c"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d99b"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0a0c10"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#222a34"/>

  <g id="title-block" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="92" font-size="18" letter-spacing="2" fill="#616c7c">RAILS 8 · POSTGRES · STRIPE</text>
    <text x="64" y="164" font-size="54" font-weight="700" fill="#e8ecf2" textLength="530" lengthAdjust="spacingAndGlyphs">refunds &amp; payouts</text>
    <rect x="606" y="124" width="14" height="46" fill="#34d99b"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#97a2b2">
      <text x="64" y="226">Give money back exactly once.</text>
      <text x="64" y="262">Partial refunds, retried requests and</text>
      <text x="64" y="298">redelivered webhooks still balance to zero.</text>
    </g>
    <text x="64" y="352" font-size="18" fill="#616c7c">integer halalas · double-entry · signed webhooks</text>
  </g>

  <g id="state-track" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
    <rect x="690" y="52" width="136" height="40" rx="8" fill="#12161d" stroke="#2f3a46"/>
    <text x="758" y="78" fill="#e8ecf2">requested</text>
    <line x1="828" y1="72" x2="852" y2="72" stroke="#616c7c" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="856" y="52" width="148" height="40" rx="8" fill="#372c12" stroke="#4a3a18"/>
    <text x="930" y="78" fill="#f2b23c">processing</text>
    <line x1="1006" y1="72" x2="1030" y2="72" stroke="#34d99b" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="1034" y="52" width="110" height="40" rx="8" fill="#12352a" stroke="#1c4c3b"/>
    <text x="1089" y="78" fill="#34d99b">settled</text>

    <path d="M758 94 L758 124 L820 124" fill="none" stroke="#616c7c" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M930 94 L930 124 L906 124" fill="none" stroke="#616c7c" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="822" y="108" width="82" height="34" rx="8" fill="#391c1b" stroke="#522725"/>
    <text x="863" y="131" fill="#ff6058">failed</text>

    <path d="M1089 94 L1089 186" fill="none" stroke="#34d99b" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arr-g)"/>
    <text x="1076" y="148" text-anchor="end" fill="#616c7c">posts once</text>
  </g>

  <g id="ledger-entry" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="690" y="190" width="454" height="166" rx="12" fill="#12161d" stroke="#222a34"/>
    <text x="714" y="222" font-size="18" fill="#97a2b2">refund 4 · charge pi_seed_2</text>
    <line x1="714" y1="236" x2="1120" y2="236" stroke="#222a34"/>
    <text x="714" y="268" font-size="20" fill="#e8ecf2">revenue:charges</text>
    <text x="1120" y="268" font-size="20" text-anchor="end" fill="#ff6058">-25.00</text>
    <text x="714" y="300" font-size="20" fill="#e8ecf2">stripe:cash</text>
    <text x="1120" y="300" font-size="20" text-anchor="end" fill="#34d99b">+25.00</text>
    <line x1="714" y1="314" x2="1120" y2="314" stroke="#2f3a46" stroke-width="2"/>
    <text x="714" y="342" font-size="18" letter-spacing="2" fill="#616c7c">SUM</text>
    <text x="1120" y="344" font-size="26" font-weight="700" text-anchor="end" fill="#34d99b">SAR 0.00</text>
  </g>
</svg>
